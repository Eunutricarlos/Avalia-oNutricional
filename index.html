</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const W=t=>`<div class="w">⚠ ${t}</div>`;
const T=[
["1 · Avaliação do Estado Nutricional",`<p><b>Jelliffe (1966):</b> mensuração das variações das dimensões físicas e da composição global do corpo em diferentes épocas da vida e graus de nutrição.</p><p><b>Objetivos:</b> identificar alterações metabólicas/orgânicas dependentes da alimentação, prevenir/controlar agravos e apoiar quem precisa de suporte imediato. <b>Balança:</b> ingestão × necessidade de nutrientes; estado ótimo = necessidades atendidas.</p><table><tr><th>Objetivos (quantitativos)<th>Subjetivos (qualitativos)<tr><td>Antropometria, bioquímica, consumo alimentar (inquéritos)<td>Exame físico, ASG</table><table><tr><th>Diretos (indivíduo)<th>Indiretos (ambiente)<tr><td>Clínica, física, bioquímica<td>Renda, saneamento, escolaridade, acesso à saúde; avaliação alimentar</table><p><b>Determinantes:</b> imediatos (estado de saúde, consumo de alimentos) → intermediários (serviços de saúde, moradia, saneamento; disponibilidade e produção de alimentos) → educação, renda, posse da terra.</p><p><b>4 focos:</b> clínica (história clínica, familiar, revisão de sistemas), bioquímica, física/antropometria e alimentar (retrospectivos: R24h, QFA, história dietética; prospectivo: registro). Um parâmetro isolado não caracteriza a condição nutricional. Início do atendimento: identificação → escuta ativa → estilo de vida.</p>`,["Jelliffe 1966: dimensões físicas + composição global","Objetivos: identificar · prevenir · apoiar","Objetivos (antropometria, bioquímica, inquéritos) × Subjetivos (exame físico, ASG)","Diretos = indivíduo · Indiretos = ambiente","Nunca um parâmetro isolado: associar indicadores"]],
["2 · Avaliação Dietética",`<p>Avalia ingestão de nutrientes, de alimentos/grupos e o padrão alimentar. Não existe método perfeito: todos dependem do relato (falhas do entrevistado, do entrevistador e do método).</p><table><tr><th>Método<th>Pontos-chave<tr><td>R24h (retrospectivo)<td>Define e quantifica o ingerido nas 24h anteriores (ou dia anterior); obrigatório: alimento, preparo e quantidade; usar álbuns de porções. + rápido, barato, não reativo, qualquer idade/analfabetos; seriados estimam o habitual. − memória, entrevistador, porções, dia atípico. <b>1 único R24h NÃO estima ingestão habitual.</b><tr><td>QFA (retrospectivo)<td>Lista FINITA de alimentos; estima ingestão habitual; estudos populacionais. Qualitativo × semiquantitativo (inclui medida caseira). − depende da memória, lista finita, quantificação pouco exata, limitado em idosos/analfabetos.<tr><td>História dietética<td>QFA + R24h; hábitos atuais e passados; considera variação sazonal; 1 a 2 h; exige nutricionista treinado.<tr><td>Registro (prospectivo)<td>Anotado no momento do consumo; 3, 5 ou 7 dias alternados, com 1 dia de fim de semana; efeito observador; exige alfabetização e medidas caseiras.</table>${W("A aula 6 fala em registro de 3 ou 4 dias alternados; a aula 2, em 3, 5 ou 7.")}`,["R24h: rápido, não reativo, mas 1 só NÃO estima o habitual","QFA: lista finita; semiquantitativo tem medida caseira","História dietética = QFA + R24h (1–2 h)","Registro: prospectivo, efeito observador, incluir fim de semana","Retrospectivo depende da memória; prospectivo = tempo real"]],
["3 · Av. Física I (aspecto geral, peso, IMC)",`<p><b>Aspecto geral:</b> bom, regular, comprometido/grave. <b>Consciência:</b> orientado, consciente, sonolento, desorientado, inconsciente, coma. <b>Temperatura:</b> hipotérmico &lt;36 °C · afebril 36–37,2 · febril &gt;37,8. <b>Diurese:</b> poliúria, oligúria, anúria. <b>Vias:</b> VO, SNG/SNE, GTT/JJT, NPT, jejum. <b>Dieta oral:</b> líquida restrita → líquidos claros → líquida total → líquido-pastosa → pastosa → branda → geral.</p><p><b>Peso:</b> atual (balança), habitual (referido), ideal = IMC desejado × altura² (22 homens, 21 mulheres), estimado (Chumlea 1988; Lee e Nieman 1995), ajustado = [(PI − PA) × 0,25] + PA quando adequação &lt;95% ou &gt;115%.</p><table><tr><th>Adequação = PA×100/PI<th>Classe<tr><td>≤70%<td>Desnutrição grave<tr><td>70,1–80<td>Moderada<tr><td>80,1–90<td>Leve<tr><td>90,1–110<td>Eutrofia<tr><td>110,1–120<td>Sobrepeso<tr><td>&gt;120<td>Obesidade</table><p><b>Perda grave:</b> &gt;2% (1 sem), &gt;5% (1 mês), &gt;7,5% (3 m), &gt;10% (6 m). Perda % = (usual − atual)/usual × 100.</p><p><b>Descontos hídricos:</b> ascite leve 4–6 kg, moderada 8–10, grave 12–14; edema tornozelo 1, joelho 3–4, raiz da coxa 5–6; anasarca 10–12 kg.</p><p><b>IMC:</b> adultos OMS &lt;16 magreza III · 16–16,9 II · 17–18,4 I · 18,5–24,9 eutrofia · 25–29,9 pré-obeso · 30–34,9 ob. I · 35–39,9 ob. II · ≥40 ob. III. Idosos (Lipschitz): &lt;22 desnutrição · 22–27 normal · &gt;27 excesso.</p>${W("Na fórmula de altura pelo joelho (negros &gt;60 anos) o slide traz “1,37 + AJ”, provável erro de digitação (seria ×).")}`,["Peso ideal = IMC desejado × altura² (22 H / 21 M)","Peso ajustado se adequação <95% ou >115%","Eutrofia pela adequação: 90,1–110%","Perda grave 1 mês >5%; 3 m >7,5%; 6 m >10%","Idoso: 22–27 normal; adulto eutrofia 18,5–24,9"]],
["4 · Av. Física II (cineantropometria)",`<p><b>Cineantropometria:</b> kinein (movimento) + anthropos (homem) + metryei (medida). Padrão: <b>ISAK</b> (2011). <b>Tríade da precisão:</b> avaliador, equipamento e ambiente. Equipamentos: estadiômetro/paquímetro (lineares), paquímetro (diâmetros), trena antropométrica (circunferências), adipômetro e balança.</p><p><b>Circunferências:</b> fita inelástica; erro crítico = comprimir o tecido. Refletem tamanho ósseo, massa muscular e gordura.</p><table><tr><th>Medida<th>Técnica<tr><td>Braço<td>Ponto médio acrômio–olécrano; flexionado: antebraço ~45°, contrair o bíceps, maior circunferência<tr><td>Cintura<td>Ponto mais estreito entre tórax e quadril (ou ponto médio entre última costela e crista ilíaca), fim da expiração. Obeso: maior perímetro (umbigo) e avaliador à frente<tr><td>Quadril<td>Maior volume glúteo, fita horizontal, avaliador ao lado<tr><td>Panturrilha<td>Em cima de caixa, peso igual nos dois pés, maior circunferência; <b>CP ≥31 cm</b> = adequação (gestantes e idosos); indica desnutrição atual</table><p><b>Risco metabólico (OMS 1998):</b> elevado H ≥94 / M ≥80 cm; muito elevado H ≥102 / M ≥88 cm.</p><p><b>RCQ = cintura/quadril.</b> Androide (maçã): obesidade superior, ponto de corte &gt;1, risco cardiovascular. Ginoide (pera): inferior, &gt;0,85, artrose e varizes. <b>Diâmetros:</b> bi-epicondilar do úmero e do fêmur, bi-estiloide.</p>${W("Os pontos de corte da RCQ (&gt;1 e &gt;0,85) estão assim no slide; vale confirmar com a professora.")}`,["ISAK 2011; tríade: avaliador, equipamento, ambiente","Fita inelástica, sem comprimir","Cintura: H ≥94/102 · M ≥80/88 cm","Androide = maçã, risco CV · Ginoide = pera, artrose/varizes","CP ≥31 cm adequação"]],
["5 · Av. Física III (dobras cutâneas)",`<p><b>Técnica:</b> hemicorpo direito; dobra formada com pinça de indicador e polegar da mão esquerda; haste do plicômetro perpendicular, ~1 cm abaixo do local marcado; leitura em 2–3 s; medidas em circuito, média das duplicatas (diferença &gt;10% → 3ª medida). Marcar pontos com lápis dermatográfico após palpação óssea.</p><table><tr><th>Dobra<th>Local e sentido<tr><td>Tricipital<td>Face posterior do braço, ponto médio acrômio–rádio; vertical<tr><td>Bicipital<td>Face anterior, mesmo nível; vertical; leve rotação externa do ombro<tr><td>Subescapular<td>2 cm a partir do ângulo inferior da escápula; oblíqua, ~45°<tr><td>Axilar média<td>Linha axilar média × linha transversal do apêndice xifoide; braço à frente<tr><td>Peitoral<td>Oblíqua; homens: metade entre linha axilar anterior e mamilo; mulheres: 1/3<tr><td>Supra-ilíaca<td>3 cm acima da crista ilíaca; diagonal interna<tr><td>Supraespinhal<td>Cruzamento dos eixos axilar e umbilical; diagonal ~45°<tr><td>Abdominal<td>5 cm à direita do umbigo; vertical<tr><td>Coxa média<td>Metade entre dobra inguinal e borda superior da patela; vertical<tr><td>Panturrilha medial<td>Joelho direito a 90°, maior perímetro da face medial; vertical</table>`,["Sempre hemicorpo direito; pinça com a mão esquerda","Leitura em até 3 s; diferença >10% → 3ª medida","Subescapular oblíqua 45°; abdominal 5 cm do umbigo","Peitoral: H metade, M 1/3","Tricipital, bicipital, abdominal, coxa e panturrilha: verticais"]],
["6 · Infância e curvas da OMS",`<p><b>Fases:</b> lactente 0–24 m, pré-escolar 3–6 a, escolar 7–9 a, adolescência 10–19 a (OMS/MS); ECA: criança até 12 incompletos, adolescente 12–18. Infância (OMS): nascimento até 9 anos. <b>Pré-escolar:</b> ganha 2–3 kg e 5–7 cm/ano; apetite menor; ingestão regulada pela saciedade. <b>Escolar:</b> mais apetite e necessidades; risco de ultraprocessados; escola e pares influenciam.</p><p><b>Anamnese:</b> socioeconômica, gestacional, neonatal (peso/comprimento, IG, RCIU, AM, introdução alimentar, Fe e vit. D), familiares (DCV, DM, dislipidemia, HAS, obesidade, alergias), estilo de vida (AF, telas, sol), interrogatório por aparelhos. <b>Sono:</b> 1 a 9–10 h + 2 sonecas; 2–3 a 10,5 h + 1; 4–6 a 10–12 h (acaba a soneca); 10 a 10–11 h; 10–18 a 8–10 h.</p><p><b>Crescimento:</b> peso = sensor precoce (curva ascendente, reta, descendente; atenção ao edema). Ganho no 1º ano: 700, 600, 500 e 300 g/mês por trimestre (25–30, 20, 15, 10 g/dia). Estatura: cumulativa, afetada mais lentamente, déficit grave pode ser permanente. Comprimento &lt;2 anos; altura &gt;2. Velocidade (cm/ano): até 6 m 15 · 6–12 m 10 · 1–2 a 15 · &gt;2 a 5–7 · puberdade meninas 9 (desde 11 a), meninos 10 (desde 13 a).</p><p><b>Alvo parental (Tanner 1986):</b> meninas [(mãe + (pai − 13)) ± 9]/2; meninos [(pai + (mãe + 13)) ± 10]/2. <b>CMB</b> = CB − (0,314 × DCT); CB comparada a Frisancho 1990.</p><p><b>OMS:</b> 2006 (0–5 a, estudo MGRS em 6 países) e 2007 (5–19 a, resposta à obesidade). Pilares: nutrição, ambiente e atenção à saúde ideais. Indicadores: 0–5 a P/I, E/I, P/E, IMC/I · 5–10 a P/I, E/I, IMC/I · 10–19 a E/I, IMC/I. P/E sai após 5 anos.</p>${W("O slide de velocidade de crescimento mostra 15 cm/ano para 1 a 2 anos; conferir com a professora.")}`,["Infância OMS: até 9 anos","Pré-escolar: 2–3 kg e 5–7 cm/ano","Peso 1º ano: 700/600/500/300 g/mês","Alvo parental: meninas ±9, meninos ±10","OMS 2006 (0–5) e 2007 (5–19); P/E só até 5 anos"]],
["7 · Classificações (Waterlow e escore-z)",`<p><b>Waterlow</b> cruza P/E (corte 90%) e E/I (corte 95%):</p><table><tr><th><th>E/I normal (&gt;95%)<th>E/I baixo (&lt;95%)<tr><th>P/E normal (&gt;90%)<td>Eutrófico<td>Pregresso (déficit de estatura, peso recuperado)<tr><th>P/E baixo (&lt;90%)<td>Agudo (wasting)<td>Crônico (agudo sobre crônico, ativo)</table><p><b>Escore-z (gráfico):</b></p><table><tr><th>Índice<th>Classificação<tr><td>P/E e IMC/I (0–5 a)<td>&gt;+3 obesidade · +2 a +3 sobrepeso · +1 a +2 risco de sobrepeso · −2 a +1 eutrofia · −3 a −2 magreza · &lt;−3 magreza acentuada<tr><td>IMC/I (5–19 a)<td>&gt;+3 obesidade grave · +2 a +3 obesidade · +1 a +2 sobrepeso · eutrofia · magreza · magreza acentuada<tr><td>Peso/I (0–10 a)<td>&gt;+2 peso elevado · −2 a +2 adequado · −3 a −2 baixo peso · &lt;−3 muito baixo<tr><td>Estat./I (0–19 a)<td>≥−2 adequada · −3 a −2 baixa · &lt;−3 muito baixa</table>`,["Waterlow: P/E 90%, E/I 95%","Agudo: P/E baixo, E/I normal · Pregresso: o inverso","Crônico: os dois baixos","z −2 a −3: magreza / baixo peso / baixa estatura","IMC/I 5–19: +1 a +2 sobrepeso, +2 a +3 obesidade, >+3 grave"]]];
// Fechadas: [aula, pergunta, alternativas, índice certo, explicação]
const C=[
[0,"Segundo a matriz de abordagem 1, qual é um método SUBJETIVO (qualitativo)?",["Antropometria","Avaliação bioquímica","Inquérito de consumo alimentar","Avaliação Subjetiva Global (ASG)"],3,"Subjetivos: exame físico e ASG. Os demais são objetivos."],
[0,"Os métodos indiretos de avaliação servem principalmente para:",["Medir pregas cutâneas","Identificar causas ambientais e contextuais, como renda e saneamento","Dosar hormônios","Avaliar manifestações no nível do corpo"],1,"Indiretos = ambiente (renda, saneamento, escolaridade, acesso à saúde). Diretos = indivíduo."],
[0,"Quais são os determinantes IMEDIATOS do estado nutricional?",["Educação e renda","Moradia e saneamento","Estado de saúde e consumo de alimentos","Posse da terra e produção de alimentos"],2,"Imediatos: estado de saúde e consumo. Os outros são intermediários ou básicos."],
[0,"Qual método de avaliação alimentar é PROSPECTIVO?",["Recordatório 24h","QFA","História dietética","Registro alimentar"],3,"R24h, QFA e história dietética são retrospectivos; o registro é feito em tempo real."],

[1,"O QFA semiquantitativo se diferencia do qualitativo por:",["Ter lista infinita de alimentos","Incluir a medida caseira (porção)","Ser prospectivo","Dispensar a memória"],1,"O semiquantitativo adiciona a dimensão da medida caseira."],

[3,"Circunferência da cintura com risco MUITO ELEVADO para mulheres:",["≥ 80 cm","≥ 88 cm","≥ 94 cm","≥ 102 cm"],1,"Homens: elevado ≥94 e muito elevado ≥102; mulheres: ≥80 e ≥88 (OMS, 1998)."],
[3,"Segundo o slide, o tipo ginoide (pera):",["Aumenta o risco cardiovascular","Tem RCQ > 1","Tem corte > 0,85 e aumenta riscos de artrose e varizes","É obesidade superior"],2,"Androide (maçã): troncular, RCQ > 1, risco cardiovascular."],

[3,"Em indivíduo obeso, sem marcos visíveis, a cintura deve ser medida:",["No maior perímetro, geralmente na altura do umbigo","Sempre na última costela","Na crista ilíaca","No ponto mais estreito"],0,"O avaliador se posiciona à frente para localizar a maior extensão do abdome."],
[4,"Qual o procedimento correto na aferição de dobras?",["Hemicorpo esquerdo, mão direita","Hemicorpo direito, dobra mantida com a mão esquerda","Qualquer lado, leitura em 10 s","Uma única medida sempre"],1,"Leitura em até 3 s; se duplicatas diferirem >10%, tomar terceira medida."],

[5,"Alvo parental (Tanner) para meninas:",["[(mãe + (pai − 13)) ± 9] / 2","[(pai + (mãe + 13)) ± 10] / 2","(pai + mãe) / 2","(mãe + pai + 13) ± 10"],0,"Meninos: [(pai + (mãe + 13)) ± 10] / 2."],

["1 · Avaliação do Estado Nutricional",[
["O que é avaliação do estado nutricional?",`<p><b>Jelliffe (1966):</b> mensuração das variações das dimensões físicas e da composição global do corpo humano em diferentes épocas da vida e graus de nutrição.</p><ul><li>Processo de identificação da condição nutricional de indivíduos e populações; mais profundo e completo que a triagem.</li><li>Mede todos os indicadores para identificar a ocorrência, natureza e extensão da alteração (da deficiência à toxicidade).</li><li><b>Associação Americana de Dietética:</b> processo detalhado, feito por nutricionista, usando histórias médica, nutricional e de medicamentos, exame físico, dados antropométricos e laboratoriais. Objetivo: confirmar a existência ou o risco de processo mórbido nutricional.</li><li>É o começo, o meio e o fim de tudo em nutrição, vital no meio clínico e no epidemiológico.</li><li>Bons métodos têm acurácia, precisão, especificidade, sensibilidade, fácil aplicabilidade e reprodutibilidade. Um indicador isolado perfeito não existe.</li></ul>`],
["Objetivos e conceito de balança",`<table><tr><th>Identificar<th>Prevenir<th>Apoiar<tr><td>Alterações metabólicas e orgânicas dependentes da alimentação, permitindo atenuação por intervenção adequada<td>Contribuir para a prevenção e o controle ativo de agravos nutricionais<td>Reconhecer quem precisa de apoio nutricional imediato para restaurar ou manter seu estado</table><p><b>Balança:</b> ingestão de nutrientes × necessidade de nutrientes. Estado nutricional ótimo = necessidades fisiológicas perfeitamente atendidas.</p><table><tr><th>Forças sobre a ingestão<th>Forças sobre a necessidade<tr><td>Fatores emocionais; econômicos; sociais e culturais; físicos (doenças, má absorção)<td>Manutenção das necessidades corporais; crescimento e desenvolvimento; condições especiais (estresse fisiológico, febre, infecção, doenças)</table>`],
["Determinantes do estado nutricional",`<ul><li><b>Imediatos:</b> estado de saúde e consumo de alimentos.</li><li><b>Intermediários:</b> serviços de saúde, moradia, saneamento (ligados à saúde); disponibilidade e produção de alimentos (ligados ao consumo).</li><li><b>Básicos:</b> educação, renda, posse da terra.</li><li>Base: aspectos históricos, econômicos, políticos, culturais e ideológicos da organização social que explicam a geração e distribuição de recursos.</li></ul>`],
["Matrizes de abordagem",`<table><tr><th>Objetivos (quantitativos)<th>Subjetivos (qualitativos)<tr><td>Antropometria (peso, altura, dobras); avaliação bioquímica (exames laboratoriais); consumo alimentar (inquéritos quantitativos)<td>Exame físico (sinais e sintomas clínicos); Avaliação Subjetiva Global (ASG)</table><table><tr><th>Diretos: O Indivíduo<th>Indiretos: O Ambiente<tr><td>Identificam manifestações orgânicas no nível do corpo: avaliação clínica, física e bioquímica<td>Identificam causas ambientais e contextuais: indicadores socioeconômicos e demográficos (renda, saneamento, escolaridade, acesso à saúde); avaliação alimentar</table>`],
["Os 4 focos",`<p><b>Foco 1 · Clínica:</b> história clínica (patologias atuais, histórico pregresso, medicamentos, cirurgias, ASG); história familiar (saúde de pais, avós e irmãos; presença de DCNT); revisão de sistemas (fisiologia geral, endocrinologia, estado emocional).</p><p><b>Foco 2 · Bioquímica:</b> exames hematológicos (hemograma, glicemia, proteína plasmática, perfil imunológico); hormonais (tireoide: TSH, T3, T4; pâncreas: insulina); função hepática; mineralograma; vitaminograma.</p><p><b>Foco 3 · Física e antropometria:</b> aspecto geral (consciência, pressão arterial, temperatura, estado geral); antropometria (peso, altura, circunferências, pregas cutâneas); sinais clínicos (mucosa, pele e cabelo, edema).</p><p><b>Foco 4 · Alimentar:</b> retrospectivos (recordatório 24h, QFA, história dietética) e prospectivo (registro alimentar, pesada direta/anotação). O consumo deve ser cruzado com alergias, intolerâncias, tabus culturais, preferências e aversões.</p><p><b>Diagnóstico de precisão:</b> clínica + bioquímica + física + alimentar. “Um parâmetro isolado não caracteriza a condição nutricional.” A escolha depende do objetivo, das condições clínicas e dos recursos.</p>`],
["Início do atendimento",`<ol><li><b>Identificação básica:</b> dados pessoais, gênero, idade/data de nascimento, estado civil, profissão, contexto socioeconômico e procedência.</li><li><b>Escuta ativa:</b> queixa principal, doença primária, problema relatado, o verdadeiro motivo da consulta.</li><li><b>Estilo de vida:</b> tabagismo, álcool e drogas, atividade física, padrão de sono, ingestão hídrica, padrão de mastigação.</li></ol>`]]],
["2 · Avaliação Dietética",[
["O que se avalia e por que medir o consumo",`<p><b>Na prática clínica:</b> ingestão quantitativa de nutrientes; consumo de alimentos ou grupos alimentares; padrão alimentar individual.</p><p><b>Por que medir:</b> estimar a ingestão; investigar a relação entre estado nutricional e desfechos de saúde; identificar padrões e hábitos ao longo do tempo; planejar políticas e programas de intervenção populacional.</p><p><b>Não existe método perfeito:</b> os métodos se baseiam no relato humano, logo sujeitos a falha. Erro de estimativa vem do <b>entrevistado</b> (memória, identificação incorreta dos alimentos, percepção da dieta, vocabulário, omissões, reações defensivas), do <b>entrevistador</b> (inabilidade de estabelecer empatia) e do <b>método</b> (dificuldade de quantificar porções).</p><p><b>Escolha do método (vieses do paciente):</b> memória, maturidade cognitiva (crianças e idosos), estimativa visual de porções e conhecimento prático (relatar preparo: óleo, forno, fritura).</p><p><b>Classificação:</b> retrospectivos dependem da memória (R24h, QFA, história alimentar); prospectivo registra em tempo real (registro alimentar).</p>`],
["O que é o Recordatório de 24 horas (R24h)?",`<ul><li>Define e quantifica todos os alimentos e bebidas ingeridos no período anterior à entrevista (24h precedentes ou, mais comumente, o dia anterior completo).</li><li><b>Obrigatório:</b> tipo de alimento, forma de preparação e quantidade exata.</li><li><b>Formulário:</b> identificação (dados demográficos, data e dia da semana, para diferenciar dias úteis de fins de semana); alimentos (horário, refeição, alimento/bebida, preparo, quantidade); observações (light/diet, integral/desnatado, sal/açúcar, temperos).</li><li>Sem auxílio visual (relato de “colheradas”), a variação gera os maiores erros de cálculo. <b>Use álbuns fotográficos de porções padronizadas.</b></li></ul><table><tr><th>Vantagens<th>Limitações<tr><td>Rapidez; não reativo; acessível a qualquer faixa etária e analfabetos; baixo custo; seriados (dias não consecutivos) estimam a ingestão HABITUAL<td>Viés de relato (memória); fator profissional (entrevistador); dificuldade de quantificar porções; dia atípico</table><p><b>ATENÇÃO: 1 único R24h NÃO estima a ingestão habitual.</b></p>`],
["O que é o QFA?",`<ul><li>Objetivo principal: estimar a ingestão habitual. Avalia se alimentos em excesso comprometem a qualidade da dieta e a relação com o risco de DCNT.</li><li>Instrumento com lista <b>FINITA</b> de alimentos pré-definidos (alimento ou grupo); muito usado em estudos populacionais.</li><li><b>Qualitativo:</b> só frequência (nunca, &lt;1/mês, 1-3/mês, 1/semana, 1/dia). <b>Semiquantitativo:</b> acrescenta a porção em medida caseira (ex.: leite 1 xícara de chá, pão francês 1 unidade; porção média de referência, ex.: 1 concha média ou 4 colheres de sopa = 90 g).</li></ul><table><tr><th>+<th>−<tr><td>Rápido, baixo custo, simples; estima ingestão habitual; não altera o consumo; minimiza variação intrapessoal<td>Total dependência da memória; lista finita (exige esforço para criar); quantificação pouco exata; limitado em idosos ou analfabetos</table>`],
["História dietética",`<p>Extensa entrevista para gerar informações sobre hábitos alimentares atuais e passados, geralmente <b>QFA + R24h</b> (associação de métodos). Exige entender o ecossistema do paciente: variações sazonais, padrões de consumo, fumo, exercícios.</p><table><tr><th>+<th>−<tr><td>Elimina variações dia a dia; considera variação sazonal; descrição mais profunda (qualitativa e quantitativa)<td>Tempo longo (1 a 2 h); exige nutricionistas treinados; difícil padronizar; exige muita memória</table>`],
["Registro dietético (diário alimentar)",`<ul><li>Registro detalhado de todo alimento consumido, feito no <b>exato momento do consumo</b>, por 3, 5 ou 7 dias, preenchidos em dias alternados, com <b>obrigatório 1 dia de fim de semana</b>.</li><li>Detalhe exigido: porções em medidas caseiras ou pesagem exata, formas de preparo, adição extra de sal, açúcar ou temperos.</li><li>Diário pode incluir horário, o que aconteceu, o que comeu, quantidade, como se sentiu e observações: revela padrões de fome, percepção de saciedade e emoções (frustração, culpa, compensação).</li></ul><table><tr><th>+<th>−<tr><td>Anotado no momento (não depende da memória); mede consumo atual com alta exatidão; maior precisão com registro de peso; menor esquecimento com boa orientação<td>Efeito observador (anotar modifica o hábito); alta carga (motivação, tempo, alfabetização); paciente deve conhecer medidas caseiras; maior custo de tempo</table><p><b>Síntese:</b> toda ferramenta tem vieses; o R24h exige técnica do entrevistador e auxílios visuais; o papel do nutricionista é aplicar empatia e escuta ativa para minimizar o erro.</p>`]]],
["3 · Av. Física I",[
["Aspecto geral, consciência e sinais vitais",`<p><b>Aspecto geral</b> (linha de base intuitiva): <b>bom</b> (corado, contactuante, sem desconforto agudo); <b>regular</b> (sinais leves de debilidade/desconforto); <b>comprometido/grave</b> (prostração, palidez, suporte intensivo).</p><p><b>Consciência:</b> orientado (lúcido no tempo e espaço); consciente (responde a estímulos verbais); sonolento (responde, mas tende a dormir); desorientado (confusão mental, perda de referência de tempo/espaço); inconsciente (não responde a chamados normais); coma (ausência total de resposta ou reflexos).</p><p><b>Pressão:</b> hipotenso (abaixo do padrão; risco de choque ou desidratação severa); normotenso (faixa normal, perfusão preservada); hipertenso (acima; risco vascular e sobrecarga cardíaca).</p><p><b>Temperatura:</b> hipotérmico &lt;36 °C (baixa atividade metabólica, choque, frio); afebril 36 a 37,2 °C (homeostase); febril &gt;37,8 °C (quadro infeccioso/inflamatório, aumento da demanda calórica e hídrica).</p>`],
["Eliminações: diurese e evacuações",`<ul><li><b>Volume:</b> poliúria (excesso), oligúria (reduzida), anúria (ausência).</li><li><b>Cor:</b> clara = bem hidratado; concentrada = indício de desidratação; hemática = sangue, trauma ou infecção grave.</li><li><b>Coleta:</b> espontânea (independente) × em fralda (dependente).</li><li><b>Sondagem vesical (SVD/SVA):</b> cateter via uretra até a bexiga, para alívio (esvaziamento temporário) ou demora (monitoramento contínuo em críticos).</li><li><b>Nefrostomia:</b> dreno direto no rim pela pele lombar, quando há obstrução total entre rim e bexiga.</li><li><b>Evacuações:</b> constipação (retenção, risco de obstrução) → padrão normal → diarreia (risco de desidratação severa e perda de nutrientes). <b>Colostomia:</b> exteriorização de porção do intestino grosso na parede abdominal; fezes vão para bolsa coletora, desviando o trânsito retal.</li></ul>`],
["Vias de alimentação e dieta oral",`<table><tr><th>Via<th>Característica<tr><td>Via oral (VO)<td>Fisiológica; exige consciência alerta e trato digestivo funcionante<tr><td>SNG/SNE<td>Sondas pelo nariz até estômago ou intestino; para quem não consegue engolir<tr><td>GTT/JJT<td>Sondas cirúrgicas diretas na parede abdominal; nutrição de longo prazo<tr><td>NPT<td>Intravenosa; só quando o intestino não funciona<tr><td>Jejum (zero)<td>Trato digestivo em repouso absoluto</table><p><b>Escada da dieta oral:</b> líquida restrita/prova (máxima restrição, preparo) → líquidos claros → líquida total → líquido-pastosa/semilíquida → pastosa → branda → geral/normal (sem restrições). A progressão depende da tolerância gastrointestinal, consciência e necessidades metabólicas.</p>`],
["O que é avaliação antropométrica?",`<p>Estudo sistemático das medidas do corpo humano para avaliação do estado nutricional.</p><table><tr><th>Instrumento<th>Mede<tr><td>Fita métrica<td>Circunferências<tr><td>Balança<td>Peso e estatura (cálculo do IMC)<tr><td>Adipômetro<td>Dobras cutâneas (DC)</table>`],
["Peso: atual, habitual, ideal, estimado e ajustado",`<ul><li><b>Atual (PA):</b> medido na hora, balança firme e plana; mínimo de roupa, descalço, ereto, braços estendidos. Reflete a soma de todos os componentes corpóreos e o equilíbrio proteico-energético (Lohman, 1988).</li><li><b>Habitual (PH):</b> referido pelo paciente; usado quando não dá para medir o PA ou para avaliar mudança/perda recente.</li><li><b>Ideal (PI):</b> definido por idade, biótipo, sexo e altura. <b>PI = IMC desejado × altura (m²)</b>; IMC médio: homens 22, mulheres 21 kg/m².</li><li><b>Ajustado:</b> <b>[(PI − PA) × 0,25] + PA</b>, quando adequação &lt;95% (desnutrição/baixo peso) ou &gt;115% (sobrepeso/obesidade). Dá mais precisão no cálculo de necessidades energéticas e proteicas.</li><li><b>Estimado (PE):</b> por fórmulas, quando não dá para pesar.</li></ul><p><b>Qual usar?</b> Pode ser pesado hoje? Sim → PA. Não → PE. Avaliar mudança recente/histórico → PH. Meta ideal por biótipo → PI. Adequação &lt;95% ou &gt;115% → peso ajustado (correção metabólica).</p>`],
["Peso estimado: Chumlea (1988) e Lee e Nieman (1995)",`<p>CB = circ. do braço (cm), DCSE = dobra subescapular (mm), AJ = altura do joelho (cm), CPA = circ. da panturrilha (cm).</p><p><b>Chumlea, homem:</b> (0,98×CPA)+(1,16×AJ)+(1,73×CB)+(0,37×DCSE)−81,69<br><b>Mulher:</b> (1,27×CPA)+(0,87×AJ)+(0,98×CB)+(0,4×DCSE)−62,35</p><p><b>Lee e Nieman</b> (só AJ e CB):</p><table><tr><th>Idade<th>Mulher branca<th>Mulher negra<th>Homem branco<th>Homem negro<tr><td>6-18<td>(AJ×0,77)+(CB×2,47)−50,16<td>(AJ×0,71)+(CB×2,59)−50,43<td>(AJ×0,68)+(CB×2,64)−50,08<td>(AJ×0,59)+(CB×2,73)−48,32<tr><td>19-59<td>(AJ×1,01)+(CB×2,81)−66,04<td>(AJ×1,24)+(CB×2,97)−82,48<td>(AJ×1,19)+(CB×3,21)−86,82<td>(AJ×1,09)+(CB×3,14)−83,72<tr><td>60-80<td>(AJ×1,09)+(CB×2,68)−65,51<td>(AJ×1,50)+(CB×2,58)−84,22<td>(AJ×1,10)+(CB×3,07)−75,81<td>(AJ×0,44)+(CB×2,86)−39,21</table>`],
["% de adequação, perda de peso e ajustes clínicos",`<p><b>Adequação (%) = peso atual × 100 / peso ideal:</b> ≤70% desnutrição grave · 70,1–80 moderada · 80,1–90 leve · 90,1–110 eutrofia · 110,1–120 sobrepeso · &gt;120 obesidade.</p><p><b>Perda de peso (%) = [(peso usual − peso atual)/peso usual] × 100</b> (Blackburn e Bistrian, 1977; a variação em relação ao habitual é o índice preditivo mais importante):</p><table><tr><th><th>1 semana<th>1 mês<th>3 meses<th>6 meses<tr><td>Significativa<td>1–2%<td>5%<td>7,5%<td>10%<tr><td>Grave<td>&gt;2%<td>&gt;5%<td>&gt;7,5%<td>&gt;10%</table><p><b>Descontar peso hídrico:</b> ascite (James, 1989) leve 4–6 kg, moderada 8–10, grave 12–14; edema tornozelo 1 kg, joelho 3–4, raiz da coxa 5–6; anasarca 10–12 kg (Riella, 2001).</p><p><b>Amputação:</b> PI ajustado = [(100% − % do segmento amputado) × PI] / 100. Segmentos: braço inteiro 5,0% (até o ombro 2,7, antebraço 1,6, mão 0,7); perna inteira 16% (acima do joelho 10,1, abaixo 4,4, pé 1,5); cabeça 8%; tronco 50%.</p>`],
["Estatura e estimativa de estatura",`<p><b>Estatura = padrão ouro</b> do crescimento linear. Posição: plano de Frankfurt (olhos no plano horizontal), contato de calcanhares, panturrilhas, escápulas e ombros com a parede; instrumento: fita inelástica (esquadro) ou antropômetro.</p><table><tr><th>Envergadura<th>Recumbente<th>Altura do joelho<tr><td>Braços estendidos (90° com o tronco); distância entre dedos médios; hemienvergadura (esterno ao dedo médio × 2) se houver deformidade ou acesso venoso<td>Pacientes confinados ao leito; supina, leito horizontal; marcar o lençol da cabeça até a base do pé direito<td>Supina ou sentado; joelho esquerdo flexionado a 90°; do calcanhar à superfície anterior da perna na altura do joelho</table><p><b>Chumlea (altura pelo joelho, AJ):</b></p><table><tr><th><th>6-18 a<th>19-60 a<th>&gt;60 a<tr><td>H branco<td>40,54+(2,22×AJ)<td>71,85+(1,88×AJ)<td>59,01+(2,08×AJ)<tr><td>H negro<td>39,60+(2,18×AJ)<td>73,42+(1,79×AJ)<td>95,79+(1,37+AJ)*<tr><td>M branca<td>43,21+(2,14×AJ)<td>70,25+(1,87×AJ)+(0,06×Id)<td>75,00+(1,91×AJ)+(0,07×Id)<tr><td>M negra<td>46,59+(2,02×AJ)<td>68,10+(1,86×AJ)−(0,06×Id)<td>58,72+(1,96×AJ)</table><p>*Como está no slide (provável erro de digitação). Base (Chumlea 1985): homens 64,19−(0,04×idade)+(2,02×AJ); mulheres 84,88−(0,24×idade)+(1,83×AJ).</p>`],
["IMC e seus pontos cegos",`<p>IMC = peso / altura². <b>Não reflete a composição corporal</b>: exemplo do slide, dois indivíduos com 100 kg e 1,80 m têm IMC 30,86, um com 6% de gordura e outro com 36%.</p><table><tr><th>Adultos (OMS 1995/1997)<th>Classificação<tr><td>&lt;16<td>Magreza III<tr><td>16–16,9<td>Magreza II<tr><td>17–18,4<td>Magreza I<tr><td>18,5–24,9<td>Eutrofia<tr><td>25–29,9<td>Pré-obeso<tr><td>30–34,9<td>Obesidade I<tr><td>35–39,9<td>Obesidade II<tr><td>≥40<td>Obesidade III</table><table><tr><th>Idosos &gt;60 (Lipschitz 1994)<th>Classificação<tr><td>&lt;22<td>Desnutrição<tr><td>22–27<td>Normal<tr><td>&gt;27<td>Excesso de peso</table><p>A faixa de segurança se desloca para o alto com o envelhecimento.</p>`]]],
["4 · Av. Física II",[
["O que é cineantropometria?",`<p>Do grego: <b>kinein</b> (movimento) + <b>anthropos</b> (homem) + <b>metryei</b> (medida). Estudo da mensuração do tamanho e proporções do corpo, sua aplicação ao movimento e os fatores que o influenciam. Padrão global: <b>ISAK</b> (Sociedade Internacional para o Progresso da Cineantropometria; padrões de 2011). Base: pontos anatômicos de referência (Norton e Olds, 2005).</p>`],
["Tríade da precisão",`<p><b>Avaliador</b> (técnica e conduta) + <b>Equipamento</b> (adequação e calibração) + <b>Ambiente</b> (controle e espaço) = precisão absoluta das medidas.</p><p><b>O avaliador deve:</b> padronizar e conhecer a técnica; familiarizar-se com os equipamentos; selecionar métodos pertinentes ao público-alvo; esclarecer os procedimentos mantendo o avaliado relaxado e confiante; marcar exatamente os pontos anatômicos. <b>Adaptabilidade:</b> idade, sexo, nível de atividade física, necessidades especiais, patologias específicas.</p><table><tr><th>Tipo de medida<th>O que mede<th>Equipamento<tr><td>Lineares (longitudinais)<td>Estatura, comprimento dos membros<td>Estadiômetro, paquímetro<tr><td>Lineares (transversais)<td>Diâmetros, envergadura<td>Paquímetro<tr><td>Circunferências<td>Perímetros<td>Trena antropométrica<tr><td>Massa e gordura<td>Dobras cutâneas, peso<td>Adipômetro, balança</table>`],
["O que são circunferências?",`<p>Medidas (perímetros) que indicam o <b>estado nutricional e o padrão corporal</b>. Refletem: 1) tamanho ósseo (base estrutural); 2) massa muscular (tecido ativo); 3) gordura adiposa (camada externa).</p><ul><li><b>Regra de ouro:</b> fita métrica <b>inelástica</b>. <b>Erro crítico:</b> comprimir o tecido adiposo.</li><li>Medidas feitas sem roupa na região de interesse.</li></ul>`],
["Circunferência do braço (CB)",`<ul><li><b>Pontos:</b> acrômio e olécrano (radial); marcar o ponto médio (nível acromial-radial médio). Braço estendido ao longo do corpo, relaxado.</li><li><b>Braço flexionado:</b> antebraço a ~45°; trazer a mão ao ombro e contrair o bíceps; registrar a <b>maior</b> circunferência; avaliador ao lado.</li><li>(aula 6) CB representa o perímetro de osso, músculo e gordura; <b>CMB = CB − (0,314 × DCT em mm)</b>; compara-se a percentis de Frisancho (1990).</li></ul>`],
["Cintura, quadril e RCQ",`<ul><li><b>Cintura:</b> em pé, pernas fechadas, abdome relaxado, fim da expiração normal, sem roupa. Fita por trás, nível horizontal. Local: região mais estreita entre tórax e quadril OU ponto médio entre a última costela e a crista ilíaca.</li><li><b>Obeso (sem marcos visíveis):</b> maior perímetro, geralmente na altura do umbigo; avaliador <b>à frente</b> do avaliado.</li><li><b>Quadril:</b> maior volume glúteo, fita em plano horizontal; avaliador ao lado; avaliado não contrai os glúteos.</li></ul><table><tr><th>Risco de complicações metabólicas (OMS 1998)<th>Homem<th>Mulher<tr><td>Elevado<td>≥94 cm<td>≥80 cm<tr><td>Muito elevado<td>≥102 cm<td>≥88 cm</table><p><b>RCQ = circunferência da cintura / circunferência do quadril.</b></p><table><tr><th>Androide (maçã)<th>Ginoide (pera)<tr><td>Obesidade superior (tronco abdominal); corte RCQ &gt;1; aumenta risco cardiovascular<td>Obesidade inferior (glúteo-femoral); corte &gt;0,85; aumenta riscos de artrose e varizes</table>`],
["Coxa, panturrilha e diâmetros",`<ul><li><b>Panturrilha:</b> avaliado em cima de uma caixa/banco; peso igualmente nos dois pés; leitura na parte lateral da perna, procurando a circunferência máxima; marcação cruzada na face medial (também ponto da dobra da panturrilha).</li><li><b>CP ≥31 cm:</b> indicador de adequação, recomendado pela OMS para gestantes e idosos; reflete massa muscular (músculo, gordura, ossos, água) e é indicador direto de desnutrição atual.</li><li><b>Diâmetros ósseos</b> (paquímetro): bi-epicondilar do úmero (entre epicôndilos umeral lateral e medial); bi-epicondilar do fêmur (entre epicôndilos femorais lateral e medial); bi-estiloide/radial (borda lateral do processo estiloide radial à borda medial do ulnar; antebraço em pronação, mão sobre o joelho, hastes ~45° para baixo).</li></ul>`],
["Exemplo de caso do slide",`<p>Altura 1,68 m; peso 76,80 kg. Cintura 86; abdômen 90; quadril 109; coxa direita 61; coxa proximal 66,5; panturrilha 34; braço relaxado 30; contraído 31,6 cm. Diâmetros: punho 4,90; fêmur 10,50 cm. Dobras: bíceps 16; tríceps 22; axilar média 20; tórax 33; panturrilha medial 18; abdominal 45; supra-ilíaca 25; subescapular 30; coxa 30 mm.</p><table><tr><th><th>Atual<th>Recomendação<th>Situação<tr><td>IMC<td>27,21<td>18,50–25,00<td>Sobrepeso<tr><td>Peso ideal<td>66,32 kg<td>–<td>–<tr><td>% massa gorda<td>37,63%<td>16–29%<td>Muito ruim<tr><td>% massa magra<td>62,37%<td>71–84%<td>Muito ruim<tr><td>Massa gorda<td>28,90 kg<td>12,29–22,27<td>Muito ruim<tr><td>Massa magra<td>47,90 kg<td>54,53–64,51<td>Muito ruim<tr><td>Soma de dobras<td>93 mm<td>–<td>–<tr><td>RCQ<td>0,78<td>abaixo de 0,73<td>Risco moderado<tr><td>AMB / AGB<td>42,42 / 29,20<td>–<td>AMB normal</table>`]]],
["5 · Av. Física III (dobras)",[
["O que são dobras cutâneas?",`<p>Medida da <b>espessura da dobra de pele</b> destacada em pontos anatômicos definidos, aferida com adipômetro (plicômetro). Entra na antropometria junto com peso, altura e circunferências e serve para estimar a gordura corporal (complemento: a dobra pinça pele + tecido adiposo subcutâneo). A precisão depende da localização exata do osso subjacente, por isso a palpação óssea é pré-requisito inegociável.</p>`],
["Técnica e padronização",`<ol><li><b>Hemicorpo direito:</b> todas as medidas no lado direito.</li><li><b>Mão esquerda:</b> forma e mantém a dobra com pinça de indicador e polegar durante toda a aferição.</li><li><b>Posicionamento:</b> haste do plicômetro perpendicular, ~1 cm abaixo do local marcado.</li><li><b>Leitura em 2–3 s</b> (até 3 s) para evitar acomodação dos tecidos.</li><li><b>Circuito:</b> usar média das duplicatas; se a diferença for &gt;10%, tomar uma terceira medida.</li></ol><p>Marcar os pontos com lápis dermatográfico antes de iniciar o circuito.</p>`],
["Dobras do braço e dorso",`<table><tr><th>Dobra<th>Localização<th>Ponto de referência<th>Sentido<tr><td>Tricipital<td>Face posterior do braço<td>Ponto médio entre acrômio e rádio<td>Vertical<tr><td>Bicipital<td>Face anterior do braço<td>Mesmo nível da tricipital; leve rotação externa do ombro<td>Vertical<tr><td>Subescapular<td>Dorso (região escapular)<td>Ponta mais baixa do ângulo inferior da escápula; marcar 2 cm ao longo da linha que desce lateral e obliquamente<td>Oblíqua ~45°</table>`],
["Dobras do tronco",`<table><tr><th>Dobra<th>Localização e referência<th>Sentido<tr><td>Axilar média<td>Intersecção da linha axilar média com linha transversal na altura do apêndice xifoide; braço do avaliado deslocado para frente<td>Vertical (ao eixo longitudinal)<tr><td>Peitoral<td>Homens: metade da distância entre linha axilar anterior e mamilo; mulheres: 1/3 da linha axilar anterior<td>Oblíqua<tr><td>Supra-ilíaca<td>3 cm acima da crista ilíaca (ponto ílio-cristal)<td>Ligeiramente diagonal interna<tr><td>Supraespinhal<td>Cruzamento dos eixos axilar (prega axilar anterior) e umbilical (ponto ílio-espinhal)<td>Diagonal interna ~45°<tr><td>Abdominal<td>5 cm à direita da cicatriz umbilical (ventre do reto abdominal)<td>Vertical</table>`],
["Dobras dos membros inferiores",`<table><tr><th>Dobra<th>Como localizar<th>Sentido<tr><td>Coxa média<td>Passo 1: achar dobra inguinal e borda superior da patela. Passo 2: ponto médio exato entre elas<td>Vertical<tr><td>Panturrilha medial<td>Joelho direito flexionado a 90° (pé relaxado sobre uma base); face medial, ponto de maior perímetro<td>Vertical</table>`]]],
["6 · Infância e curvas da OMS",[
["Fases da vida e características",`<table><tr><th>Saúde (OMS/MS)<th>Direito (ECA/Estatuto da Juventude)<tr><td>Lactente 0–24 m; pré-escolar 3–6 a; escolar 7–9 a; adolescência 10–19 a; juventude 15–24 a<td>Criança: até 12 anos incompletos; adolescente 12–18; jovem 15–29</table><p>A infância, segundo a OMS, vai do nascimento até os 9 anos.</p><ul><li><b>Pré-escolar (3–6 a):</b> crescimento diminui (ganho de 2 a 3 kg/ano e 5 a 7 cm/ano); sistema digestivo comparável ao adulto, mas volume gástrico pequeno; apetite e necessidades diminuem e o comportamento fica imprevisível; ingestão regulada pela saciedade; alimento classificado por cor, forma e quantidade, não por nutrição.</li><li><b>Escolar (7–9 a):</b> TGI mais desenvolvido e maior volume gástrico; crescimento constante com ganho de peso que precede o estirão; maior apetite e necessidades calóricas; alerta: aumento de ultraprocessados e queda de alimentos naturais pela aceitação social. Escola, pares e mídia pesam.</li><li><b>Desenvolvimento:</b> 4–6 a pensamento lógico concreto; 7–9 a autovalor global e pares superam a família; 10 a fim da infância, primeiras mudanças da puberdade (meninas ~11, meninos ~13).</li><li>Comportamento alimentar reflete a dinâmica familiar; práticas coercivas (forçar a comer) vêm da ansiedade parental e prejudicam a autorregulação.</li></ul>`],
["Anamnese: clínica, dietética e física",`<p><b>Visão global:</b> história clínica, exame físico, antropometria, exames laboratoriais, história dietética; comparar com curvas da OMS, numa visão <b>longitudinal</b>.</p><ul><li><b>Socioeconômico:</b> ocupação e escolaridade dos pais, saneamento (lixo, água, esgoto, energia), habitação. <b>Gestacional:</b> pré-natal, anemia, infecções, DM, HAS, parto, estado nutricional, medicamentos, álcool, fumo, drogas. <b>Pessoal/neonatal:</b> peso e comprimento ao nascer, IG, RCIU, aleitamento materno, introdução alimentar, suplementos (Fe e vit. D).</li><li><b>Familiares:</b> DCV, DM, dislipidemia, HAS, obesidade, alergia alimentar. <b>Estilo de vida:</b> atividade física, tempo de telas, exposição solar, brincadeiras. <b>Interrogatório por aparelhos:</b> sucção/deglutição, vômitos e distensão, hábito intestinal, pele/cabelos/unhas, diurese.</li><li><b>Sono:</b> 1 ano 9–10 h (+2 sonecas, total 13 h); 2–3 a 10,5 h (+1 soneca, 12–12,5 h); 4–6 a 10–12 h (acaba a soneca); 10 a 10–11 h; 10–18 a 8–10 h.</li><li><b>Parâmetros:</b> pré-escolar/escolar = foco familiar (hábitos, atividade, internações, risco familiar de DCNT); adolescente = autonomia (estadiamento puberal, imagem corporal, comportamento, fast-food, álcool, anabolizantes, tabagismo e drogas).</li><li><b>História dietética:</b> R24h (reflete 1 dia, memória, viés), registro (3 ou 4 dias alternados, mais tempo, pode omitir alimentos), frequência (escolher o grupo exato, ex.: carnes/vísceras na anemia). Observar local das refeições, autonomia, particularidades clínicas, rituais/distrações (chantagem, telas), estresse do cuidador. Não induzir respostas.</li></ul>`],
["Crescimento, peso e estatura",`<p><b>Crescimento:</b> processo multifatorial e progressivo (hipertrofia, hiperplasia celular, acúmulo extracelular). Fatores intrínsecos: sistema neuroendócrino, gestação, hereditariedade. Extrínsecos: ambiente, vínculo mãe-filho, nutrição; a doença interfere.</p><ul><li><b>Peso = sensor precoce</b> (massa orgânica e inorgânica): curva ascendente (ganho adequado), reta (menor velocidade), descendente (desnutrição inicial). <b>Cuidado com edema.</b></li><li><b>Ganho no 1º ano:</b> 1º trimestre 700 g/mês (25–30 g/dia); 2º 600 (20); 3º 500 (15); 4º 300 (10).</li><li><b>Estatura = retrato a longo prazo:</b> cumulativa, reflete estado nutricional de longa duração, afetada mais lentamente que o peso; déficit grave pode não se recuperar.</li><li><b>Medição:</b> comprimento (&lt;2 anos, deitado, cabeça no plano de Frankfurt, joelhos pressionados, cursor na sola dos pés a 90°); altura (&gt;2 anos, em pé: cabeça, ombros, nádegas, panturrilhas e calcanhares).</li><li><b>Velocidade (cm/ano):</b> até 6 m 15; 6–12 m 10; 1–2 a 15 (conforme slide); &gt;2 a 5–7; puberdade meninas 9 (desde 11 a), meninos 10 (desde 13 a).</li><li><b>Alvo parental (Tanner 1986):</b> meninas [(mãe + (pai − 13)) ± 9]/2; meninos [(pai + (mãe + 13)) ± 10]/2. Ex.: pai 176, mãe 171, menino → [(176 + (171+13)) ± 10]/2 ≈ 175 a 185 cm.</li></ul>`],
["Curvas da OMS e indicadores",`<ul><li><b>0–5 anos (OMS 2006):</b> população com oportunidade de crescer plenamente; diagnóstico e vigilância; crianças saudáveis crescem de modo semelhante, independente de etnia. <b>5–19 anos (OMS 2007):</b> resposta à obesidade infantil; escala contínua de IMC.</li><li><b>MGRS:</b> estudo em 6 países (Pelotas-Brasil, Davis-EUA, Oslo-Noruega, Acra-Gana, Nova Délhi-Índia, Mascate-Omã): o potencial de crescimento é universal; diferenças até 5 anos refletem fatores ambientais.</li><li><b>3 pilares do crescimento ideal:</b> nutrição (aleitamento, alimentação complementar de qualidade), ambiente (saneamento, moradia, mães não fumantes) e atenção à saúde (imunizações, acompanhamento pediátrico).</li></ul><table><tr><th>Faixa<th>Indicadores<tr><td>0–5 a incompletos (2006)<td>P/I, E/I, P/E, IMC/I<tr><td>5–10 a incompletos (2007)<td>P/I, E/I, IMC/I<tr><td>10–19 a (2007)<td>E/I, IMC/I</table><p>P/E sai após 5 anos; E/I e IMC/I acompanham até a vida adulta. Gráficos do material: comprimento/altura, peso, P/C e P/A, IMC e perímetro cefálico (até 2 anos), por sexo.</p>`],
["Classificação por percentil e escore-z",`<table><tr><th>Percentil<th>Escore-z<th>Diagnóstico<tr><td>&lt;0,1<td>&lt;−3<td>Magreza acentuada; muito baixo peso para a idade; muito baixa estatura<tr><td>≥0,1 e &lt;3<td>≥−3 e &lt;−2<td>Magreza; baixo peso; baixa estatura<tr><td>≥3 e ≤85<td>≥−2 e ≤+1<td>Eutrofia; peso adequado; estatura adequada<tr><td>&gt;85 e ≤97<td>&gt;+1 e ≤+2<td>Risco de sobrepeso (0–5 a); sobrepeso (5–19 a)<tr><td>&gt;97 a 99,9<td>&gt;+2 a +3<td>Sobrepeso, obesidade<tr><td>&gt;99,9<td>&gt;+3<td>Obesidade grave</table><p>A conclusão do material: a avaliação nutricional <b>não é um retrato, é um filme</b>; exige acompanhamento longitudinal.</p>`]]],
["7 · Classificações (Waterlow e escore-z)",[
["Waterlow",`<p>Cruza P/E (corte 90%) e E/I (corte 95%).</p><table><tr><th><th>E/I normal (&gt;95%)<th>E/I baixo (&lt;95%)<tr><th>P/E normal (&gt;90%)<td>Eutrófico<td>Pregresso<tr><th>P/E baixo (&lt;90%)<td>Agudo<td>Crônico</table><ul><li><b>Agudo:</b> perdeu peso agora, estatura normal.</li><li><b>Pregresso:</b> peso recuperado, estatura baixa (marca de desnutrição passada).</li><li><b>Crônico:</b> peso e estatura baixos (aguda sobre crônica, ativa).</li></ul>`],
["Gráfico de escores-z",`<table><tr><th>z<th>P/E e IMC/I (0–5 a)<th>IMC/I (5–19 a)<th>Peso/I (0–10 a)<th>Estat./I (0–19 a)<tr><td>&gt;+3<td>Obesidade<td>Obesidade grave<td rowspan=2>Peso elevado<td rowspan=3>Estatura adequada<tr><td>+2 a +3<td>Sobrepeso<td>Obesidade<tr><td>+1 a +2<td>Risco de sobrepeso<td>Sobrepeso<td>Peso adequado<tr><td>−2 a +1<td>Eutrofia<td>Eutrofia<td>Peso adequado<td>Estatura adequada<tr><td>−3 a −2<td>Magreza<td>Magreza<td>Baixo peso<td>Baixa estatura<tr><td>&lt;−3<td>Magreza acentuada<td>Magreza acentuada<td>Muito baixo peso<td>Muito baixa estatura</table>`]]]];

let h='';
if(V=='home'){const n=Object.keys(P.a).length,ac=Object.values(P.a).filter(x=>x).length,best=P.s.length?Math.max(...P.s):0;
h=`<h1>Avaliação Nutricional</h1><p class="m">Prof.ª Sheylane Andrade · conteúdo montado a partir dos slides das 6 aulas e das classificações (Waterlow e escore-z).</p><div class="card"><b>Progresso:</b> ${n}/${C.length} questões respondidas · ${ac} acertos · ${n-ac} erros<div class="bar"><i style="width:${n/C.length*100}%"></i></div><p class="m">Simulados feitos: ${P.s.length}${P.s.length?' · melhor: '+best+'%':''}</p></div><button class="b" onclick="go('rev')">⚡ Revisão</button><button class="b" onclick="go('q')">📝 Questões</button><button class="b" onclick="go('sim')">🎯 Simulado</button><h2>Assuntos</h2>`+T.map((t,i)=>{const ids=C.map((x,k)=>k).filter(k=>C[k][0]==i),d=ids.filter(k=>k in P.a).length;return`<div class="card" onclick="F=${i};go('study')"><b>${t[0]}</b><div class="bar"><i style="width:${d/ids.length*100}%"></i></div><span class="m">${d}/${ids.length} questões</span></div>`}).join('')+`<p class="m">Banco: ${C.length} fechadas + ${O.length} abertas. Progresso salvo neste navegador.</p><button class="m" onclick="if(confirm('Zerar progresso?')){P={a:{},s:[]};sv();draw()}">Zerar progresso</button>`}
if(V=='study')h='<h1>📚 Estudar</h1>'+E.map((t,i)=>`<details ${F==i?'open':''}><summary>${t[0]}</summary>${t[1].map(u=>`<details><summary>${u[0]}</summary>${u[1]}</details>`).join('')}</details>`).join('');
if(V=='rev')h='<h1>⚡ O que preciso saber para a prova?</h1>'+T.map(t=>`<details open><summary>${t[0]}</summary><ul>${t[2].map(x=>`<li>${x}</li>`).join('')}</ul></details>`).join('');
if(V=='q'){if(!Q){const pool=C.map((x,i)=>i).filter(i=>F<0||C[i][0]==F),pe=pool.filter(i=>!(i in P.a)),src=pe.length?pe:pool;Q={i:src[Math.floor(Math.random()*src.length)],d:false}}
h=`<h1>📝 Questões</h1><select onchange="F=+this.value;Q=null;draw()"><option value="-1">Todos os assuntos</option>${T.map((t,i)=>`<option value="${i}" ${F==i?'selected':''}>${t[0]}</option>`).join('')}</select>`+qc(Q.i,Q.d,'pk',Q.s)+(Q.d?`<button class="b" onclick="Q=null;draw()">Próxima →</button>`:'')}
if(V=='sim')h=simv();
if(V=='err'){const e=Object.keys(P.a).filter(i=>!P.a[i]);h='<h1>❌ Questões erradas</h1>'+(e.length?e.map(i=>qc(+i,true,'x',C[i][3]).replace('✅ Acertou!','Resposta certa:')).join('')+`<button class="b" onclick="redo()">Refazer erradas</button>`:'<p>Nenhuma questão errada ainda. 🎉</p>')}
$('#app').innerHTML=h;window.scrollTo(0,0)}
function redo(){Object.keys(P.a).filter(i=>!P.a[i]).forEach(i=>delete P.a[i]);sv();F=-1;go('q')}
function pk(i,j){Q.d=true;Q.s=j;P.a[i]=j==C[i][3]?1:0;sv();draw()}
function simv(){
if(!S)return`<h1>🎯 Simulado</h1><div class="card"><p>10 questões sorteadas: 7 fechadas e 3 abertas. Ao final: acertos, erros, aproveitamento e explicações.</p><button class="b" onclick="S={q:[...sh(C.map((x,i)=>i)).slice(0,7).map(i=>({k:'c',i})),...sh(O.map((x,i)=>i)).slice(0,3).map(i=>({k:'o',i}))],n:0,r:[],s:null,v:false};draw()">Começar</button></div>`;
if(S.n>=10){const ok=S.r.filter(r=>r.ok).length,p=ok*10;if(!S.sv){S.sv=1;P.s.push(p);sv()}
return`<h1>Resultado</h1><div class="card"><h2>${ok} acertos · ${10-ok} erros · ${p}% de aproveitamento</h2></div>`+S.r.filter(r=>!r.ok).map(r=>r.k=='c'?qc(r.i,true,'x',r.s):`<div class="card"><p><b>${O[r.i][1]}</b></p><p><b>Esperada:</b> ${O[r.i][2]}</p></div>`).join('')+`<button class="b" onclick="S=null;draw()">Novo simulado</button>`}
const c=S.q[S.n];let h=`<h1>🎯 Questão ${S.n+1}/10</h1><div class="bar"><i style="width:${S.n*10}%"></i></div>`;
if(c.k=='c')return h+qc(c.i,S.v,'sp',S.s)+(S.v?`<button class="b" onclick="S.r.push({k:'c',i:${c.i},s:S.s,ok:S.s==C[${c.i}][3]});S.n++;S.v=false;draw()">Próxima →</button>`:'');
return h+`<div class="card"><p class="m">Aberta · ${T[O[c.i][0]][0]}</p><p><b>${O[c.i][1]}</b></p><textarea id="ta" placeholder="Escreva sua resposta..."></textarea>`+(S.v?`<p><b>Resposta esperada:</b> ${O[c.i][2]}</p><button class="b" onclick="so(1)">Acertei</button><button class="b" onclick="so(0)">Errei</button>`:`<button class="b" onclick="S.v=true;S.t=$('#ta').value;draw();$('#ta').value=S.t">Ver resposta esperada</button>`)+'</div>'}
function sp(i,j){S.s=j;S.v=true;draw()}
function so(ok){S.r.push({k:'o',i:S.q[S.n].i,ok:!!ok});S.n++;S.v=false;draw()}
draw();
</script></body></html>
